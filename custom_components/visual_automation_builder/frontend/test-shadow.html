<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VAB shadow test</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
      }
      #host {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <script type="module" src="./automation-builder.js?v=0.1.11"></script>
    <script type="module">
      const host = document.getElementById("host");
      const root = host.attachShadow({ mode: "open" });
      const el = document.createElement("automation-builder");
      el.style.cssText = "display:block;height:100%";
      root.appendChild(el);
      el.hass = { states: { "light.test": { entity_id: "light.test", state: "on", attributes: { friendly_name: "Test Light" } } } };
    </script>
  </body>
</html>
